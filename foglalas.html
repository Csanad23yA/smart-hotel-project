<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHotel | Szoba Foglalása</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="foglalas.css?v=pure_fix">
</head>
<body>

    <div class="container">
        <h2 class="form-title">Szoba <span>Foglalása</span></h2>
        <div class="gold-line"></div>
        
        <form id="booking-form">
            <div class="form-group">
                <label for="guest-name">Teljes név</label>
                <input type="text" id="guest-name" placeholder="pl. Kovács János" required>
            </div>

            <div class="form-group">
                <label for="room-select">Szoba kiválasztása</label>
                <select id="room-select" required>
                    <option value="" disabled selected>Töltés...</option>
                </select>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label for="check-in-date">Érkezés</label>
                    <input type="date" id="check-in-date" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="check-out-date">Távozás</label>
                    <input type="date" id="check-out-date" required>
                </div>
            </div>

            <div id="summary-box" class="summary-box">
                <div class="summary-row"><span>Szoba típusa:</span> <span id="sum-type">-</span></div>
                <div class="summary-row"><span>Éjszakák száma:</span> <span id="sum-nights">0</span></div>
                <div class="summary-row"><span>Ár / éjszaka:</span> <span id="sum-rate">0 Ft</span></div>
                <div class="summary-total"><span>Végösszeg:</span> <span id="sum-total">0 Ft</span></div>
            </div>

            <button type="submit" class="btn-gold">FOGLALÁS LEADÁSA</button>
        </form>
        
        <a href="szobak.html" class="back-link">← Vissza a szobákhoz</a>
    </div>

    <script src="foglalas.js"></script>
</body>
</html>
